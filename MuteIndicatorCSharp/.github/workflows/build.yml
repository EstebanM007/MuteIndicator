name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore MuteIndicatorCSharp/MuteIndicatorCSharp.csproj
    
    - name: Build Release
      run: dotnet build MuteIndicatorCSharp/MuteIndicatorCSharp.csproj -c Release --no-restore
    
    - name: Publish
      run: dotnet publish MuteIndicatorCSharp/MuteIndicatorCSharp.csproj -c Release -o publish
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: publish/MuteIndicator.exe
    
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuteIndicator-Release
        path: publish/
