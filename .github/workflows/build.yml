name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore MuteIndicatorCSharp/MuteIndicatorCSharp.csproj
    
    - name: Build Release
      run: dotnet build MuteIndicatorCSharp/MuteIndicatorCSharp.csproj -c Release --no-restore
    
    - name: Publish
      run: dotnet publish MuteIndicatorCSharp/MuteIndicatorCSharp.csproj -c Release -o publish
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MuteIndicator-Release
        path: publish/
